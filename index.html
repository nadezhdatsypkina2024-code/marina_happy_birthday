<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Марина, с Днём Рождения! 🌟</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Caveat:wght@500;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height: 100vh;
  background: radial-gradient(ellipse at bottom, #0d1b4b 0%, #000510 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-family: 'Nunito', sans-serif;
  overflow: hidden; user-select: none;
  position: relative;
  padding: 15px;
}

.bg-stars {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
}

.header {
  position: relative; z-index: 10;
  text-align: center; margin-bottom: 20px;
  width: 100%;
  max-width: 450px;
}
.header h1 {
  font-family: 'Caveat', cursive;
  font-size: 2.4rem; color: #ffe066;
  text-shadow: 0 0 10px rgba(255,224,102,0.5);
  animation: floatTitle 4s ease-in-out infinite;
}
@keyframes floatTitle {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.card-container {
  position: relative; z-index: 10;
  width: 100%;
  max-width: 450px;
  min-height: 320px;
}

.card {
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.07);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 24px;
  padding: 30px 25px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

@media (max-width: 480px) {
  .header h1 { font-size: 2rem; }
  .card { padding: 25px 15px; }
  .card h2 { font-size: 1.4rem !important; }
  .card p { font-size: 1rem !important; }
  button { padding: 12px 24px !important; font-size: 0.95rem !important; }
}

.card h2 {
  font-size: 1.7rem; color: #fff; margin-bottom: 15px; font-weight: 700;
}
.card p {
  font-size: 1.1rem; color: #ccd4ff; line-height: 1.5; margin-bottom: 25px;
}

.btn-group {
  display: flex; gap: 15px; justify-content: center; width: 100%; flex-wrap: wrap;
}
button {
  padding: 14px 28px; border: none; border-radius: 50px;
  font-family: 'Nunito', sans-serif; font-size: 1.05rem; font-weight: 900;
  cursor: pointer; transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  touch-action: manipulation;
}
.btn-primary {
  background: linear-gradient(135deg, #ff416c, #ff4b2b); color: #fff;
}
.btn-primary:hover {
  transform: translateY(-3px); box-shadow: 0 8px 25px rgba(255,65,108,0.4);
}
.btn-secondary {
  background: rgba(255,255,255,0.15); color: #fff;
  border: 1px solid rgba(255,255,255,0.2);
}
.btn-secondary:hover {
  background: rgba(255,255,255,0.25); transform: translateY(-3px);
}

.confetti {
  position: fixed; pointer-events: none; z-index: 5;
  border-radius: 2px;
  animation: explode linear forwards;
}
@keyframes explode {
  0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
}

canvas {
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="header">
  <h1>Марина, с Днём Рождения! 🌟</h1>
</div>

<div class="card-container">
  <div class="card" id="questCard">
    <h2>Марина, привет! ✨</h2>
    <p>Я приготовила для тебя кое-что особенное в этот день. Готова начать небольшое праздничное приключение?</p>
    <div class="btn-group">
      <button class="btn-primary" onclick="step1()">Да, поехали! 🎉</button>
    </div>
  </div>
</div>

<script>
function isMobile() {
  return window.innerWidth <= 768 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

const card = document.getElementById('questCard');

function changeCard(htmlContent) {
  card.style.opacity = '0';
  card.style.transform = 'scale(0.95)';
  setTimeout(() => {
    card.innerHTML = htmlContent;
    card.style.opacity = '1';
    card.style.transform = 'scale(1)';
  }, 400);
}

function step1() {
  changeCard(`
    <h2>Шаг первый 🌟</h2>
    <p>Пусть этот день начнется с улыбки! Ответь честно: ты сегодня уже успела загадать самое заветное желание?</p>
    <div class="btn-group">
      <button class="btn-primary" onclick="step2(true)">Да, сразу как проснулась! ✨</button>
      <button class="btn-secondary" onclick="step2(false)">Ещё нет, жду подходящего момента 🤫</button>
    </div>
  `);
}

function step2(isHappy) {
  changeCard(`
    <h2>Шаг второй 🎂</h2>
    <p>Правильно! А теперь время для праздничного салюта в твою честь. Нажимай скорее на кнопку!</p>
    <div class="btn-group">
      <button class="btn-primary" onclick="finalStep()">ЗАПУСТИТЬ САЛЮТ! 🚀</button>
    </div>
  `);
}

function finalStep() {
  changeCard(`
    <h2 style="color:#ffe066; font-size:2rem; font-family:'Caveat', cursive;">С Днём Рождения, Марина! 🥳🎉💖</h2>
    <p style="font-size:1.1rem;">Пусть твоя жизнь будет такой же яркой, переливающейся и волшебной, как этот салют! С праздником!</p>
    <div class="btn-group">
      <button class="btn-primary" onclick="spawnConfettiLoop()">Пройти еще раз 💫</button>
    </div>
  `);
  
  for(let i=0; i<3; i++) {
    setTimeout(spawnConfetti, i*300);
  }
}

function spawnConfettiLoop() {
  for(let i=0; i<2; i++) {
    setTimeout(spawnConfetti, i*200);
  }
}

function spawnConfetti() {
  const colors = ['#ff416c', '#ff4b2b', '#ffe066', '#00f2fe', '#4facfe', '#b1f2ff', '#ffb3fd'];
  const count = isMobile() ? 30 : 70;
  
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    const x = Math.random() * window.innerWidth;
    
    const dy = -(100 + Math.random() * 250);
    const dx = (Math.random() - 0.5) * 350;
    
    c.style.cssText = `
      left:${x}px; top:${window.innerHeight * 0.45}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      --dx:${dx}px; --dy:${dy}px;
      --rot:${Math.random()*360}deg;
      animation-duration:${0.7 + Math.random()*0.8}s;
      animation-delay:${Math.random()*0.2}s;
      width:${5 + Math.random()*7}px;
      height:${5 + Math.random()*7}px;
    `;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1500);
  }
}

const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const stars = Array.from({length: isMobile() ? 70 : 180}, () => {
  return {
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 1.5 + 0.3,
    a: Math.random(),
    speed: 0.003 + Math.random() * 0.007
  };
});

function drawBgStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => {
    s.a += s.speed;
    if (s.a > 1 || s.a < 0) s.speed = -s.speed;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.a)})`;
    ctx.fill();
  });
  requestAnimationFrame(drawBgStars);
}
drawBgStars();
</script>
</body>
</html>
